name: lint

on: [push, pull_request]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax
        run: bash -n server-bench.sh && bash -n tests/integration.sh
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck server-bench.sh tests/integration.sh
  regressions:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: offline behavior regressions
        run: python3 -m unittest discover -s tests -v
